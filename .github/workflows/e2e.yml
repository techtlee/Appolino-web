# The end-to-end suite (tests/e2e, README "Tests") on every push and pull request.
#
# It runs inside the Playwright image the screenshot baselines are made in
# (npm run test:e2e:update, tests/e2e/docker.mjs): the same Linux, fonts and browsers, so a
# screenshot is compared like for like. The image's tag and @playwright/test in package.json
# must move together.
name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "1"
      E2E_VISUAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Type-check the tests
        run: npx tsc -p tests/e2e
      - name: Run the suite
        run: npx playwright test
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload the failures (screenshots, traces, diffs)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
